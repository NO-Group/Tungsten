<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111311" />
    <meta name="description" content="Tungsten — a rugged development environment." />
    <link rel="icon" type="image/png" href="./resources/icon.png" />
    <title>Tungsten IDE</title>

    <!--
      The boot screen.

      Inline, because it has to paint on the first frame: a <link> to a
      stylesheet or a React mount both arrive after the bundle, which is
      exactly the wait this is here to cover.

      It is designed as a still image, not as an intro.

      Tungsten starts in well under a second, so almost nobody ever sees a
      boot *sequence* -- they see one frame, maybe two, and form an opinion
      from it. An entrance choreography is therefore the wrong instrument:
      it is a thing that looks good only in the one case nobody wants, a
      slow start, and that spends the fast case rendering a half-finished
      composition. So nothing here animates its way in. The layout is
      correct and complete in the first painted frame, and the only things
      that move afterwards are the two that represent real work: the
      progress bar, and the line of text naming what is being loaded.

      What carries it instead is typography and the Graphene principles --
      dense over airy, one accent, contrast earned, instrumentation rather
      than decoration. The mark is the element cell: tungsten is 74 on the
      table, symbol W, 183.84 u, and it melts at 3422 degrees, higher than
      any other metal. That is where the name comes from and it is worth
      saying once, plainly, in a box.

      The colours are Graphene, copied here as first-paint values the same
      way the :root block in styles.css is. `src/boot/splash.test.ts` fails
      if any of them drifts from src/theme/tokens.json.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #111311;
        color: #d5d9d5;
        font-family: 'DM Sans', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
        /*
          No filter on the way out. A blur on a full-screen layer would be
          asked for at the exact moment React is mounting the workbench
          underneath, so the one frame the product is judged on is the one
          frame guaranteed to drop. Opacity and transform are composited.
        */
        transition: opacity 340ms ease, transform 340ms cubic-bezier(0.3, 0, 0.2, 1);
        will-change: opacity, transform;
      }

      #boot.done {
        opacity: 0;
        /* Receding, not lunging: the screen steps back to let the
           workbench through. */
        transform: scale(0.985);
        pointer-events: none;
      }

      /*
        A static lattice. It was drifting before; a 14-second loop nobody
        is present for is just a repaint, and on a weak machine it is a
        repaint competing with the parse of the bundle this screen exists
        to cover.
      */
      #boot .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(#2b302b 1px, transparent 1px),
          linear-gradient(90deg, #2b302b 1px, transparent 1px);
        background-size: 44px 44px;
        opacity: 0.14;
        mask-image: radial-gradient(68% 58% at 50% 48%, #000 10%, transparent 76%);
      }

      /* One soft lift behind the composition so it is not floating on flat black. */
      #boot .glow {
        position: absolute;
        width: 760px;
        height: 420px;
        border-radius: 50%;
        background: radial-gradient(60% 60% at 50% 50%, #c8f16920 0%, transparent 70%);
        opacity: 0.6;
      }

      /* ------------------------------------------------------- the plate */

      #boot .plate {
        position: relative;
        width: 460px;
        max-width: calc(100vw - 48px);
      }

      /*
        Registration marks. Four corner ticks, drawn as borders on two
        pseudo-elements, the way a drawing is trimmed. They frame the
        composition without boxing it in, which a full rectangle would.
      */
      #boot .plate::before,
      #boot .plate::after {
        content: '';
        position: absolute;
        width: 13px;
        height: 13px;
        border: 1px solid #2b302b;
      }

      #boot .plate::before {
        top: -17px;
        left: -17px;
        border-right: 0;
        border-bottom: 0;
      }

      #boot .plate::after {
        right: -17px;
        bottom: -17px;
        border-left: 0;
        border-top: 0;
      }

      /* ------------------------------------------------- identity, row 1 */

      #boot .identity {
        display: flex;
        align-items: stretch;
        gap: 20px;
      }

      /*
        The element cell. Everything in it is true, which is the whole
        reason it is more interesting than a logo: 74, W, 183.84 u.
      */
      #boot .cell {
        position: relative;
        flex: none;
        width: 92px;
        height: 92px;
        border: 1px solid #383e38;
        background: #171a17;
      }

      /* The accent appears exactly twice on this screen. Once here. */
      #boot .cell::before {
        content: '';
        position: absolute;
        top: -1px;
        left: -1px;
        width: 15px;
        height: 15px;
        border-top: 1px solid #c8f169;
        border-left: 1px solid #c8f169;
      }

      #boot .cell .number,
      #boot .cell .mass {
        position: absolute;
        font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        font-size: 9.5px;
        letter-spacing: 0.08em;
        color: #858c86;
      }

      #boot .cell .number { top: 7px; left: 9px; }
      #boot .cell .mass { right: 9px; bottom: 7px; }

      #boot .cell .symbol {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Optical, not geometric: a W is bottom-heavy and sits low in its
           box unless it is lifted. */
        padding-bottom: 4px;
        font-size: 52px;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #f0f3ef;
      }

      #boot .naming {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
      }

      #boot .wordmark {
        font-size: 26px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.3em;
        /* Tracking is added to the right of the last letter too, so
           without this the word sits visibly off its own left edge. */
        margin-right: -0.3em;
        color: #f0f3ef;
        white-space: nowrap;
      }

      #boot .rule {
        height: 1px;
        margin: 13px 0;
        background: linear-gradient(90deg, #383e38, #2b302b 62%, transparent);
      }

      #boot .tagline {
        margin: 0;
        font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        font-size: 10px;
        line-height: 1.5;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #858c86;
      }

      /* -------------------------------------------------- readout, row 2 */

      #boot .console { position: relative; margin-top: 30px; }

      #boot .track {
        height: 2px;
        background: #232723;
        overflow: hidden;
      }

      #boot .fill {
        position: relative;
        height: 100%;
        width: 4%;
        background: #c8f169;
        /* The accent, the second and last time. */
        box-shadow: 0 0 9px #c8f16960;
        transition: width 300ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      /*
        Six milestones, one line.

        This was a six-row checklist, which is a shape borrowed from
        installers -- things that take minutes. At this length it was a
        wall of text that ticked itself off faster than anyone could read
        it. The milestones are all still here and still honest; they are
        stacked and crossfaded, so it reads as one label that keeps
        changing rather than six that flicker.
      */
      #boot .steps {
        position: relative;
        height: 14px;
        margin: 11px 0 0;
        padding: 0;
        list-style: none;
        font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        font-size: 10.5px;
        letter-spacing: 0.04em;
      }

      #boot .steps li {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #858c86;
        opacity: 0;
        transition: opacity 200ms ease;
      }

      #boot .steps li::before {
        content: '\203A';
        color: #5b615c;
      }

      #boot .steps li.active { opacity: 1; color: #d5d9d5; }
      #boot .steps li.active::before { color: #c8f169; }

      /* Done and not current means superseded: the next one is the line now. */
      #boot .steps li.done { opacity: 0; }
      #boot .steps li.done.active { opacity: 1; }

      #boot .steps li .detail { margin-left: auto; color: #5b615c; }

      /* ----------------------------------------------------- spec, row 3 */

      /*
        Three facts. Two of them are the build you are actually looking at,
        stamped in at build time -- which is the difference between a
        decoration and an instrument. When someone says the site is broken,
        this line is the first question answered.
      */
      #boot .spec {
        display: flex;
        gap: 14px;
        margin: 26px 0 0;
        font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        font-size: 9.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #5b615c;
      }

      #boot .spec span { white-space: nowrap; }
      #boot .spec .melt { margin-left: auto; }

      #boot .hint {
        position: absolute;
        bottom: 26px;
        font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.08em;
        color: #5b615c;
      }

      /* ---------------------------------------- when it could not start */

      #boot .failed {
        margin: 0;
        color: #df756f;
        font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        font-size: 11px;
        line-height: 1.6;
        word-break: break-word;
      }

      #boot .failed-help {
        margin: 10px 0 0;
        font-size: 11px;
        line-height: 1.6;
        color: #858c86;
      }

      #boot .failed-actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }

      #boot .failed-actions button {
        padding: 7px 13px;
        border: 1px solid #2b302b;
        border-radius: 3px;
        background: #c8f169;
        color: #10140c;
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }

      #boot .failed-actions button.quiet {
        background: #1d201d;
        color: #d5d9d5;
      }

      /* ------------------------------------------------------- narrow */

      @media (max-width: 520px) {
        #boot .identity { gap: 15px; }
        #boot .cell { width: 72px; height: 72px; }
        #boot .cell .symbol { font-size: 40px; }
        #boot .wordmark { font-size: 20px; letter-spacing: 0.24em; margin-right: -0.24em; }
        #boot .spec .melt { display: none; }
      }

      /*
        There is almost nothing here to turn off, which is the point: a
        still composition is already the reduced-motion version. What
        remains is the progress bar easing its width, and that is the one
        thing on screen reporting real work, so it stays -- it just stops
        easing and simply moves.
      */
      @media (prefers-reduced-motion: reduce) {
        #boot, #boot .fill, #boot .steps li { transition-duration: 1ms; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot" role="status" aria-live="polite" aria-label="Tungsten is starting">
      <div class="grid"></div>
      <div class="glow"></div>

      <div class="plate">
        <div class="identity">
          <div class="cell" aria-hidden="true">
            <span class="number">74</span>
            <span class="symbol">W</span>
            <span class="mass">183.84</span>
          </div>
          <div class="naming">
            <div class="wordmark">TUNGSTEN</div>
            <div class="rule"></div>
            <p class="tagline">A rugged development environment</p>
          </div>
        </div>

        <div class="console">
          <div class="track"><div class="fill" data-boot-fill></div></div>
          <ul class="steps" data-boot-steps>
            <li data-step="chrome">Graphene theme</li>
            <li data-step="workbench">Workbench</li>
            <li data-step="grammars">Language grammars</li>
            <li data-step="shell">Shell dictionary</li>
            <li data-step="blocks">Block library</li>
            <li data-step="workspace">Workspace</li>
          </ul>
        </div>

        <p class="spec">
          <span>Version <span data-boot-version>dev</span></span>
          <span>Build <span data-boot-build>local</span></span>
          <span class="melt">Melts at 3422 &#176;C</span>
        </p>
      </div>

      <p class="hint">Press Ctrl+Shift+P for the command palette</p>
    </div>

    <!--
      The watchdog.

      The boot screen's own failsafe lives in src/boot/splash.ts, which is
      inside the bundle -- so it covers a slow start and a crashed render,
      and covers nothing at all when the bundle is the thing that failed.
      That is the one case where a boot screen becomes a permanent wall:
      the markup above paints with no JavaScript whatsoever, so a 404 on
      the module below leaves it spinning for ever with no way to tell.

      Hence this: inline, classic (not a module, so a browser that cannot
      parse the bundle can still parse this), and deliberately ES5. It
      stands down the moment the real controller attaches, and otherwise
      says what went wrong in words somebody can act on.
    -->
    <script data-boot-watchdog>
      (function () {
        var DEADLINE_MS = 9000
        var boot = document.getElementById('boot')
        if (!boot) return

        var reason = ''
        var shown = false

        function sentence(error) {
          if (!error) return ''
          if (error.target && error.target !== window && error.target.src) {
            return 'The application bundle did not load: ' + error.target.src
          }
          return error.message ? 'The application failed while starting: ' + error.message : ''
        }

        function show(text) {
          if (shown || !document.getElementById('boot')) return
          shown = true
          var console_ = boot.querySelector('.console')
          var tagline = boot.querySelector('.tagline')
          if (tagline) tagline.textContent = 'Could not start'
          if (!console_) return

          console_.innerHTML = ''
          var said = document.createElement('p')
          said.className = 'failed'
          said.textContent = text || 'The application did not start, and did not say why.'
          console_.appendChild(said)

          var help = document.createElement('p')
          help.className = 'failed-help'
          help.textContent = text.indexOf('bundle') > -1
            ? 'A file the page asked for was not served. If this is a fresh deployment, check that the host is publishing the build output (dist) rather than the repository.'
            : 'Reloading is safe: nothing in the workspace is lost by it.'
          console_.appendChild(help)

          var row = document.createElement('div')
          row.className = 'failed-actions'

          var again = document.createElement('button')
          again.type = 'button'
          again.textContent = 'Try again'
          again.onclick = function () { location.reload() }
          row.appendChild(again)

          var clear = document.createElement('button')
          clear.type = 'button'
          clear.className = 'quiet'
          clear.textContent = 'Clear cached app data'
          clear.onclick = function () {
            clear.textContent = 'Clearing…'
            var jobs = []
            // A service worker holding yesterday's shell is the other way
            // this screen stays up, and no amount of reloading fixes it.
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (list) {
                return Promise.all(list.map(function (one) { return one.unregister() }))
              }))
            }
            if (window.caches && caches.keys) {
              jobs.push(caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key) }))
              }))
            }
            Promise.all(jobs)['catch'](function () { return null }).then(function () { location.reload() })
          }
          row.appendChild(clear)

          console_.appendChild(row)
        }

        // A resource that failed to load fires on the window in the
        // capture phase only, which is why this listener is not `onerror`.
        window.addEventListener('error', function (event) {
          var said = sentence(event)
          if (!said) return
          reason = reason || said
          // A missing bundle is final: there is nothing still coming.
          if (event.target && event.target.src) show(reason)
        }, true)

        window.addEventListener('unhandledrejection', function (event) {
          var error = event.reason
          reason = reason || ('The application failed while starting: '
            + ((error && error.message) || String(error)))
        })

        setTimeout(function () {
          var still = document.getElementById('boot')
          if (!still) return
          // The controller attached, so the bundle is running and its own
          // failsafe owns the screen from here.
          if (still.getAttribute('data-controller') === 'on') return
          show(reason)
        }, DEADLINE_MS)
      })()
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
